services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - mailserver
    volumes:
      - ./frontend:/app
    environment:
      - NODE_ENV=development

  mailserver:
    build:
      context: ./mailserver
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - ./mailserver/.env